[package]
name = "dtn-wal"
version = "0.1.0"
edition = "2021"
authors = ["Manish Tula <MANISHTULA7777@GMAIL.COM>"]
description = "Crash-resilient, append-only SQLite WAL store-and-forward bundle queue for delay-tolerant networks (DTN) and off-grid radio mesh."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/IBEASTMANISH/dtn-wal"
documentation = "https://docs.rs/dtn-wal"
keywords = ["dtn", "delay-tolerant", "mesh", "store-and-forward", "sqlite"]
categories = ["network-programming", "embedded"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
