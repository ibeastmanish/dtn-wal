[package]
name = "dtn-wal"
version = "0.2.0"
edition = "2021"
authors = ["Manish Tula <MANISHTULA7777@GMAIL.COM>"]
description = "Crash-safe append-only write-ahead log and store-and-forward bundle queue for delay-tolerant networks: fixed-size frame headers, hardware CRC32C, crash-safe log rotation."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/IBEASTMANISH/dtn-wal"
documentation = "https://docs.rs/dtn-wal"
keywords = ["dtn", "delay-tolerant", "wal", "store-and-forward", "mesh"]
categories = ["network-programming", "embedded"]

[dependencies]
crc32c = "0.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
crash-sim = { version = "0.2.0", path = "../crash-sim" }
